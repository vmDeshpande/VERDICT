name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      mongo:
        image: mongo:9.0
        env:
          MONGO_INITDB_ROOT_USERNAME: verdict
          MONGO_INITDB_ROOT_PASSWORD: verdict
          MONGO_INITDB_DATABASE: verdict
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://verdict:verdict@localhost:27017/verdict?authSource=admin
      TEST_MONGODB_URI: mongodb://verdict:verdict@localhost:27017/verdict_test?authSource=admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      MONGODB_URI: mongodb://verdict:verdict@localhost:27017/verdict_test?authSource=admin
      TEST_MONGODB_URI: mongodb://verdict:verdict@localhost:27017/verdict_test?authSource=admin
    services:
      mongo:
        image: mongo:9.0
        env:
          MONGO_INITDB_ROOT_USERNAME: verdict
          MONGO_INITDB_ROOT_PASSWORD: verdict
          MONGO_INITDB_DATABASE: verdict
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e