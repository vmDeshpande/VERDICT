services:
  mongo:
    image: mongo:9.0
    container_name: verdict-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: verdict
      MONGO_INITDB_ROOT_PASSWORD: verdict
      MONGO_INITDB_DATABASE: verdict
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data: